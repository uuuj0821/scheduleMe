<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ScheduleMe</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts (손글씨 + 고딕) -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #fdf6e3;
      font-family: 'Noto Sans', sans-serif;
    }

    h1, h2, h3, h4 {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 2rem;
      color: #333;
    }

    .container-box {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.05);
    }

    .notepad-card {
      background-color: #fff;
      border: 1px solid #ddd;
      border-left: 5px solid #a1c5ff;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.03);
    }

    .completed {
      text-decoration: line-through;
      color: #888;
      font-style: italic;
    }

    .btn-pastel {
      background-color: #a1c5ff;
      border: none;
      color: #fff;
    }

    .btn-pastel:hover {
      background-color: #82b1ff;
    }

    .auth-bar {
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .logout-button {
      background: none;
      border: none;
      padding: 0;
      color: #007bff;
      cursor: pointer;
      text-decoration: underline;
    }
    .logout-button:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="container-box">

      <div class="auth-bar text-end">
        {% if user.is_authenticated %}
          안녕하세요, <strong>{{ user.full_name }}</strong>님 |
          <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="logout-button">로그아웃</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">로그인</a> |
          <a href="{% url 'signup' %}">회원가입</a>
        {% endif %}
      </div>

      <hr>
      {% block content %}{% endblock %}

    </div>
  </div>
</body>
</html>
